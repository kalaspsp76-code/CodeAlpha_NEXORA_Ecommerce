{% extends "shop/base.html" %}
{% block title %}Register — NEXORA{% endblock %}
{% block content %}<div class="auth"><div class="form-card"><p class="eyebrow">JOIN NEXORA</p><h1>Create account</h1><form method="post">{% csrf_token %}<label>Username<input name="username" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><label>Confirm password<input type="password" name="confirm_password" required></label><button class="btn full">Create account</button></form><p>Already registered? <a href="{% url 'login' %}">Login</a></p></div></div>{% endblock %}
